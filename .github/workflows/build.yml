name: Build

# PR / main check: same three plain binaries as release.yml (Windows .dll,
# Linux .so, macOS .dylib on Apple Silicon), no packaging.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
          modules: ''

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Assimp
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-assimp.ps1

      - name: Build
        shell: cmd
        run: |
          qmake OpenRGB3DSpatialPlugin.pro CONFIG+=release
          nmake

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: release/OpenRGB3DSpatialPlugin.dll
          if-no-files-found: error

  build-linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          chmod +x scripts/ci/*.sh
          sudo bash scripts/ci/install-linux-deps.sh 6

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          cache: true
          modules: ''

      - name: Build Assimp
        run: bash scripts/build-assimp.sh

      - name: Build
        env:
          QT_BIN_DIR: ${{ env.QT_ROOT_DIR }}/bin
        run: bash scripts/ci/build-linux.sh 6 release

      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: libOpenRGB3DSpatialPlugin.so
          if-no-files-found: error

  build-macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true
          modules: ''
          aqtversion: '>=3.2.0'

      - name: Build Assimp
        run: |
          export ASSIMP_BUILD_DIR="${GITHUB_WORKSPACE}/_deps/assimp-build"
          export ASSIMP_INSTALL_DIR="${GITHUB_WORKSPACE}/_deps/assimp-install"
          export CC=clang CXX=clang++
          bash scripts/build-assimp.sh

      - name: Build
        run: bash scripts/ci/build-macos.sh 6 release

      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: libOpenRGB3DSpatialPlugin.dylib
          if-no-files-found: error

  presets-smoke:
    name: Presets content smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Wolfieeewolf/OpenRGB3DSpatialPresets
          path: presets

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run smoke_presets.py
        working-directory: presets
        run: python scripts/smoke_presets.py
