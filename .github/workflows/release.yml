name: Release

# One plugin binary per OS, plus the two Qt modules OpenRGB does not ship
# (Network and OpenGLWidgets):
#   Windows  OpenRGB3DSpatialPlugin.dll        (x64, Qt 6.8.3 MSVC) + 2 DLLs
#   Linux    libOpenRGB3DSpatialPlugin.so      (amd64, Qt 6.8.3)    + 2 .so.6
#   macOS    libOpenRGB3DSpatialPlugin.dylib   (universal, Qt 6.8.3) + frameworks zip
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create/update a GitHub release from this run (tag pushes always release)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
          modules: ''

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Assimp
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-assimp.ps1

      - name: Build
        shell: cmd
        run: |
          qmake OpenRGB3DSpatialPlugin.pro CONFIG+=release
          nmake

      # Official OpenRGB 1.0 for Windows does not ship these two Qt modules;
      # without them the plugin silently fails to load.
      - name: Collect Qt DLLs OpenRGB does not ship
        shell: pwsh
        run: |
          Copy-Item "$env:QT_ROOT_DIR\bin\Qt6Network.dll" release\
          Copy-Item "$env:QT_ROOT_DIR\bin\Qt6OpenGLWidgets.dll" release\

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            release/OpenRGB3DSpatialPlugin.dll
            release/Qt6Network.dll
            release/Qt6OpenGLWidgets.dll
          if-no-files-found: error

  build-linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          chmod +x scripts/ci/*.sh
          sudo bash scripts/ci/install-linux-deps.sh 6

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          cache: true
          modules: ''

      - name: Build Assimp
        run: bash scripts/build-assimp.sh

      - name: Build
        env:
          QT_BIN_DIR: ${{ env.QT_ROOT_DIR }}/bin
        run: bash scripts/ci/build-linux.sh 6 release

      # OpenRGB's AppImage does not bundle these; a distro's own copy is usually a
      # different Qt version and will not load next to the AppImage's Qt.
      - name: Collect Qt libraries OpenRGB does not ship
        run: |
          for lib in Network OpenGLWidgets; do
            cp -L "$QT_ROOT_DIR/lib/libQt6${lib}.so.6" "libQt6${lib}.so.6"
            patchelf --set-rpath '$ORIGIN' "libQt6${lib}.so.6"
          done
          readelf -d libOpenRGB3DSpatialPlugin.so | grep -E 'NEEDED|RUNPATH'

      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: |
            libOpenRGB3DSpatialPlugin.so
            libQt6Network.so.6
            libQt6OpenGLWidgets.so.6
          if-no-files-found: error

  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true
          modules: ''
          aqtversion: '>=3.2.0'

      - name: Build Assimp
        run: |
          export ASSIMP_BUILD_DIR="${GITHUB_WORKSPACE}/_deps/assimp-build"
          export ASSIMP_INSTALL_DIR="${GITHUB_WORKSPACE}/_deps/assimp-install"
          export CC=clang CXX=clang++
          bash scripts/build-assimp.sh

      - name: Build
        run: |
          bash scripts/ci/build-macos.sh 6 release
          otool -L libOpenRGB3DSpatialPlugin.dylib

      # Official Qt frameworks are universal, so one job packs them.
      - name: Pack Qt frameworks OpenRGB.app does not ship
        if: matrix.arch == 'arm64'
        run: |
          mkdir -p qtfw
          for fw in QtNetwork QtOpenGLWidgets; do
            cp -R "$QT_ROOT_DIR/lib/${fw}.framework" qtfw/
            rm -rf "qtfw/${fw}.framework/Headers" "qtfw/${fw}.framework/Versions/A/Headers"
            codesign --force --sign - "qtfw/${fw}.framework/Versions/A"
          done
          (cd qtfw && zip -qry ../macOS-Qt-frameworks.zip .)

      - uses: actions/upload-artifact@v6
        if: matrix.arch == 'arm64'
        with:
          name: qtfw-macos
          path: macOS-Qt-frameworks.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}
          path: libOpenRGB3DSpatialPlugin.dylib
          if-no-files-found: error

  macos-universal:
    name: macOS universal
    needs: build-macos
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: macos-*
      - name: lipo
        run: |
          lipo -create \
            macos-arm64/libOpenRGB3DSpatialPlugin.dylib \
            macos-x86_64/libOpenRGB3DSpatialPlugin.dylib \
            -output libOpenRGB3DSpatialPlugin.dylib
          codesign --force --sign - libOpenRGB3DSpatialPlugin.dylib
          lipo -info libOpenRGB3DSpatialPlugin.dylib
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: libOpenRGB3DSpatialPlugin.dylib
          if-no-files-found: error

  # Companion Fabric mod (integrations/minecraft) — stays in this repo, not presets.
  build-minecraft:
    name: Minecraft Fabric mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: integrations/minecraft/**/gradle-wrapper.properties
      - name: Build mod
        working-directory: integrations/minecraft
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/minecraft-out"
          # Remap jar only (skip -sources / -dev / -javadoc).
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'openrgb-minecraft-sender-*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar')
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "expected exactly one remapped jar, found:" >&2
            ls -la build/libs >&2
            exit 1
          fi
          cp "${jars[0]}" "$GITHUB_WORKSPACE/minecraft-out/"
          ls -la "$GITHUB_WORKSPACE/minecraft-out"
      - uses: actions/upload-artifact@v6
        with:
          name: minecraft
          path: minecraft-out/*.jar
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-windows, build-linux, macos-universal, build-minecraft]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    steps:
      # Licence and notices ship with every release (the Qt libraries are LGPL).
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            LICENSE
            THIRD-PARTY-NOTICES.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir assets
          cp artifacts/windows/OpenRGB3DSpatialPlugin.dll \
             artifacts/windows/Qt6Network.dll \
             artifacts/windows/Qt6OpenGLWidgets.dll \
             artifacts/linux/libOpenRGB3DSpatialPlugin.so \
             artifacts/linux/libQt6Network.so.6 \
             artifacts/linux/libQt6OpenGLWidgets.so.6 \
             artifacts/macos/libOpenRGB3DSpatialPlugin.dylib \
             artifacts/qtfw-macos/macOS-Qt-frameworks.zip \
             artifacts/minecraft/*.jar \
             LICENSE THIRD-PARTY-NOTICES.md assets/
          ls -la assets
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.0.0-ci-${GITHUB_SHA::7}"
          fi
          NOTES="$(cat <<'EOF'
          Pre-built plugins for OpenRGB 1.0 (Qt 6.8.3). Download the one for your OS:

          | OS | File |
          | --- | --- |
          | Windows (x64) | `OpenRGB3DSpatialPlugin.dll` **plus** `Qt6Network.dll` and `Qt6OpenGLWidgets.dll` |
          | Linux (x86_64, OpenRGB **AppImage**) | `libOpenRGB3DSpatialPlugin.so` **plus** `libQt6Network.so.6` and `libQt6OpenGLWidgets.so.6` |
          | macOS (Apple Silicon + Intel) | `libOpenRGB3DSpatialPlugin.dylib` **plus** `macOS-Qt-frameworks.zip` |
          | Minecraft (Fabric) | `openrgb-minecraft-sender-*.jar` → drop in the Minecraft `mods` folder |

          1. **Windows only:** put `Qt6Network.dll` and `Qt6OpenGLWidgets.dll` in the folder that contains `OpenRGB.exe` (OpenRGB 1.0 does not ship them; without them the plugin will not load).
          2. **Linux AppImage:** put the two `libQt6*.so.6` files in `~/.config/OpenRGB/plugins/`, next to the plugin. Using your distro's OpenRGB package instead? Do not use these files; build with `scripts/install-linux-user.sh` so the plugin matches your Qt.
          3. **macOS:** unzip `macOS-Qt-frameworks.zip` into the same folder as the plugin (`~/.config/OpenRGB/plugins/`).
          4. Install the plugin via OpenRGB → Settings → Plugins → Install Plugin, then restart OpenRGB.
          5. Get the **current** looks from [OpenRGB3DSpatialPresets](https://github.com/Wolfieeewolf/OpenRGB3DSpatialPresets) — the plugin ships with no effects of its own, and older copies run at the wrong speed with this version.
          6. **Minecraft Room Ambilight / Game effects:** install the Fabric jar from this release into `.minecraft/mods` (see `integrations/minecraft/README.md`). Sources stay in this plugin repo — not the presets pack.

          **Status:** tested on Windows only. Please [report](https://github.com/Wolfieeewolf/OpenRGB3DSpatialPlugin/issues/new/choose) what you see, with your GPU, driver and OpenRGB log.
          - **Linux:** audio effects need `pactl` and `parec` (pulseaudio-utils; libpulse on Arch). On Wayland, Screen Mirror asks once which monitors to share (needs PipeWire and xdg-desktop-portal). Reactive keyboard/mouse needs your user in the `input` group.
          - **macOS (experimental, untested):** audio effects do not work (OpenRGB does not ask macOS for audio permission); Reactive keyboard/mouse is not available yet. Screen Mirror needs Screen Recording permission. Everything else should work.

          Getting started guide: https://github.com/Wolfieeewolf/OpenRGB3DSpatialPlugin/wiki/Getting-Started

          Licence: GPL-2.0-or-later (`LICENSE`). Third-party components, including the LGPL Qt libraries above, are listed in `THIRD-PARTY-NOTICES.md`.
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
