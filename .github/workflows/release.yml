name: Release

# Three plain plugin binaries, nothing else:
#   Windows  OpenRGB3DSpatialPlugin.dll        (x64, Qt 6.8.3 MSVC)
#   Linux    libOpenRGB3DSpatialPlugin.so      (amd64, Qt 6.8.3)
#   macOS    libOpenRGB3DSpatialPlugin.dylib   (universal arm64 + x86_64, Qt 6.8.3)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create/update a GitHub release from this run (tag pushes always release)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
          modules: ''

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Assimp
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-assimp.ps1

      - name: Build
        shell: cmd
        run: |
          qmake OpenRGB3DSpatialPlugin.pro CONFIG+=release
          nmake

      # Official OpenRGB 1.0 for Windows does not ship these two Qt modules;
      # without them the plugin silently fails to load.
      - name: Collect Qt DLLs OpenRGB does not ship
        shell: pwsh
        run: |
          Copy-Item "$env:QT_ROOT_DIR\bin\Qt6Network.dll" release\
          Copy-Item "$env:QT_ROOT_DIR\bin\Qt6OpenGLWidgets.dll" release\

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            release/OpenRGB3DSpatialPlugin.dll
            release/Qt6Network.dll
            release/Qt6OpenGLWidgets.dll
          if-no-files-found: error

  build-linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          chmod +x scripts/ci/*.sh
          sudo bash scripts/ci/install-linux-deps.sh 6

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          cache: true
          modules: ''

      - name: Build Assimp
        run: bash scripts/build-assimp.sh

      - name: Build
        env:
          QT_BIN_DIR: ${{ env.QT_ROOT_DIR }}/bin
        run: bash scripts/ci/build-linux.sh 6 release

      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: libOpenRGB3DSpatialPlugin.so
          if-no-files-found: error

  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true
          modules: ''
          aqtversion: '>=3.2.0'

      - name: Build Assimp
        run: |
          export ASSIMP_BUILD_DIR="${GITHUB_WORKSPACE}/_deps/assimp-build"
          export ASSIMP_INSTALL_DIR="${GITHUB_WORKSPACE}/_deps/assimp-install"
          export CC=clang CXX=clang++
          bash scripts/build-assimp.sh

      - name: Build
        run: bash scripts/ci/build-macos.sh 6 release

      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}
          path: libOpenRGB3DSpatialPlugin.dylib
          if-no-files-found: error

  macos-universal:
    name: macOS universal
    needs: build-macos
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: macos-*
      - name: lipo
        run: |
          lipo -create \
            macos-arm64/libOpenRGB3DSpatialPlugin.dylib \
            macos-x86_64/libOpenRGB3DSpatialPlugin.dylib \
            -output libOpenRGB3DSpatialPlugin.dylib
          lipo -info libOpenRGB3DSpatialPlugin.dylib
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: libOpenRGB3DSpatialPlugin.dylib
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-windows, build-linux, macos-universal]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir assets
          cp artifacts/windows/OpenRGB3DSpatialPlugin.dll \
             artifacts/windows/Qt6Network.dll \
             artifacts/windows/Qt6OpenGLWidgets.dll \
             artifacts/linux/libOpenRGB3DSpatialPlugin.so \
             artifacts/macos/libOpenRGB3DSpatialPlugin.dylib assets/
          ls -la assets
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.0.0-ci-${GITHUB_SHA::7}"
          fi
          NOTES="$(cat <<'EOF'
          Pre-built plugins for OpenRGB 1.0 (Qt 6.8.3). Download the one for your OS:

          | OS | File |
          | --- | --- |
          | Windows (x64) | `OpenRGB3DSpatialPlugin.dll` **plus** `Qt6Network.dll` and `Qt6OpenGLWidgets.dll` |
          | Linux (x86_64) | `libOpenRGB3DSpatialPlugin.so` |
          | macOS (Apple Silicon + Intel) | `libOpenRGB3DSpatialPlugin.dylib` |

          1. **Windows only:** put `Qt6Network.dll` and `Qt6OpenGLWidgets.dll` in the folder that contains `OpenRGB.exe` (OpenRGB 1.0 does not ship them; without them the plugin will not load).
          2. Install the plugin via OpenRGB → Settings → Plugins → Install Plugin, then restart OpenRGB.
          3. Get the looks: copy folders from [OpenRGB3DSpatialPresets](https://github.com/Wolfieeewolf/OpenRGB3DSpatialPresets) — the plugin ships with no effects of its own.

          Getting started guide: https://github.com/Wolfieeewolf/OpenRGB3DSpatialPlugin/wiki/Getting-Started
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
