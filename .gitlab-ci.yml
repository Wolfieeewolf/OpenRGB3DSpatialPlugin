# GitLab CI — three plain plugin binaries on the OpenRGB org runners:
#   Windows 64  OpenRGB3DSpatialPlugin.dll
#   Linux amd64 libOpenRGB3DSpatialPlugin.so
#   MacOS       libOpenRGB3DSpatialPlugin.dylib
# GitHub (release.yml) is canonical for releases; this mirrors it for the
# OpenRGB pipeline. Jobs need the OpenRGBDevelopers linux/macos/shared-windows tags.

.downstream_rules:
  rules:
    - if: $CI_PROJECT_PATH !~ /^(OpenRGBDevelopers|Wolfieeewolf)\/OpenRGB3DSpatialPlugin$/ && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true

.upstream_rules:
  rules:
    - if: '$CI_PROJECT_PATH =~ /^(OpenRGBDevelopers|Wolfieeewolf)\/OpenRGB3DSpatialPlugin$/ && $RUN_CI == "true" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "web")'
      when: on_success
    - if: '$CI_PROJECT_PATH =~ /^(OpenRGBDevelopers|Wolfieeewolf)\/OpenRGB3DSpatialPlugin$/ && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      when: on_success
    - if: '$CI_PROJECT_PATH =~ /^(OpenRGBDevelopers|Wolfieeewolf)\/OpenRGB3DSpatialPlugin$/ && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG)'
      when: manual
      allow_failure: true
    - !reference [.downstream_rules, rules]

stages:
  - build

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 0

"Windows 64":
  tags:
    - shared-windows
    - windows
    - windows-1809
  stage: build
  script:
    - scripts\build-windows.bat 6.8.3 2022 64
    - mv "OpenRGB3DSpatialPlugin Windows 64-bit\OpenRGB3DSpatialPlugin.dll" .
  artifacts:
    name: "${CI_PROJECT_NAME}_Windows_64_${CI_COMMIT_SHORT_SHA}"
    paths:
      - OpenRGB3DSpatialPlugin.dll
    expire_in: 30 days
  rules:
    - !reference [.upstream_rules, rules]

"Linux amd64":
  image: registry.gitlab.com/openrgbdevelopers/openrgb-linux-ci-deb-builder:trixie-amd64
  tags:
    - linux
    - amd64
  stage: build
  script:
    - export $(dpkg-architecture)
    - chmod +x scripts/build-plugin.sh
    - ./scripts/build-plugin.sh qt6
  artifacts:
    name: "${CI_PROJECT_NAME}_Linux_amd64_${CI_COMMIT_SHORT_SHA}"
    paths:
      - ./libOpenRGB3DSpatialPlugin.so
    expire_in: 30 days
  rules:
    - !reference [.upstream_rules, rules]

"MacOS":
  tags:
    - macos
  stage: build
  script:
    - chmod +x scripts/build-macos.sh
    - ./scripts/build-macos.sh qt6 arm
  artifacts:
    name: "${CI_PROJECT_NAME}_MacOS_${CI_COMMIT_SHORT_SHA}"
    paths:
      - libOpenRGB3DSpatialPlugin.dylib
    expire_in: 30 days
  rules:
    - !reference [.upstream_rules, rules]
