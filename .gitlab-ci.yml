#-----------------------------------------------------------#
# SaaS fallbacks for the personal GitLab mirror             #
#-----------------------------------------------------------#
"Linux amd64 (SaaS)":
  stage: build
  image: debian:trixie
  tags: [saas-linux-small-amd64]
  variables:
    QT_MAJOR: "6"
    QT_AQT_VERSION: "6.8.3"
    QT_AQT_ARCH: "linux_gcc_64"
    QT_BIN_DIR: "/opt/qt/6.8.3/gcc_64/bin"
    DIST_VARIANT: Linux_amd64
  script:
    - chmod +x scripts/ci/*.sh
    - |
      set -euo pipefail
      bash scripts/ci/install-linux-deps.sh "${QT_MAJOR}"
      if [ ! -x "${QT_BIN_DIR}/qmake" ]; then
        QT_BIN_DIR="/opt/qt/${QT_AQT_VERSION}/linux_gcc_64/bin"
      fi
      export PATH="${QT_BIN_DIR}:${PATH}"
      qmake -v
      bash scripts/ci/build-linux.sh "${QT_MAJOR}" release
      bash scripts/ci/package-linux.sh "${QT_MAJOR}" amd64
  artifacts:
    name: "${CI_PROJECT_NAME}_Linux_amd64_saas_${CI_COMMIT_SHORT_SHA}"
    paths: [dist/, libOpenRGB3DSpatialPlugin.so]
    expire_in: 30 days
  rules:
    - !reference [.upstream_rules, rules]

"Windows 64 (SaaS)":
  stage: build
  tags: [saas-windows-medium-amd64]
  variables:
    QT_MAJOR: "6"
    QT_AQT_VERSION: "6.8.3"
    QT_AQT_ARCH: "win64_msvc2022_64"
    QT_BIN_DIR: "C:\\Qt\\6.8.3\\msvc2022_64\\bin"
    QT_MSVC_BOOTSTRAP_PACKAGE: "visualstudio2022buildtools"
    DIST_VARIANT: "Windows_64"
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/gitlab-windows-build.ps1
  artifacts:
    name: "${CI_PROJECT_NAME}_Windows_64_saas_${CI_COMMIT_SHORT_SHA}"
    paths: [dist/, release/OpenRGB3DSpatialPlugin.dll]
    expire_in: 30 days
  rules:
    - !reference [.upstream_rules, rules]
