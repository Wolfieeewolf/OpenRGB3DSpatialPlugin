# GitLab CI — same Qt6 pipeline matrix as OpenRGBEffectsPlugin / OpenRGB master.
# Target host: OpenRGB pipeline (Plugin API 5). Qt5 jobs are omitted on purpose.
#
# Org runner jobs need OpenRGBDevelopers linux/macos/shared-windows tags.
# Personal GitLab (wolfieeewolf1) still has SaaS fallbacks at the bottom.

.downstream_rules:
  rules:
    - if: $CI_PROJECT_PATH !~ /^(OpenRGBDevelopers|wolfieeewolf1)\/OpenRGB3DSpatialPlugin$/ && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true

.upstream_rules:
  rules:
    - if: '$CI_PROJECT_PATH =~ /^(OpenRGBDevelopers|wolfieeewolf1)\/OpenRGB3DSpatialPlugin$/ && $RUN_CI == "true" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "web")'
      when: on_success
    - if: '$CI_PROJECT_PATH =~ /^(OpenRGBDevelopers|wolfieeewolf1)\/OpenRGB3DSpatialPlugin$/ && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      when: on_success
    - if: '$CI_PROJECT_PATH =~ /^(OpenRGBDevelopers|wolfieeewolf1)\/OpenRGB3DSpatialPlugin$/ && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG)'
      when: manual
      allow_failure: true
    - !reference [.downstream_rules, rules]

.shared_windows_runners:
  tags:
    - shared-windows
    - windows
    - windows-1809

stages:
  - build
  - deploy

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 0

before_script:
  - echo "started by ${GITLAB_USER_NAME}"

.ccache_init: &ccache_init
  before_script:
    - export APPIMAGE_EXTRACT_AND_RUN=1
    - echo "started by ${GITLAB_USER_NAME}"

#-----------------------------------------------------------#
# Linux portable .so — OpenRGB trixie CI images (pipeline)  #
#-----------------------------------------------------------#
.hidden_linux_script: &linux_script_steps
  image: registry.gitlab.com/openrgbdevelopers/openrgb-linux-ci-deb-builder:trixie-${TGT_ARCH}
  tags:
    - linux
    - ${TGT_ARCH}
  stage: build
  script:
    - export $(dpkg-architecture)
    - chmod +x scripts/build-plugin.sh
    - ./scripts/build-plugin.sh qt6
  artifacts:
    name: "${CI_PROJECT_NAME}_Linux_${TGT_NAME}_${CI_COMMIT_SHORT_SHA}"
    paths:
      - ./libOpenRGB3DSpatialPlugin.so
    expire_in: 30 days
  rules:
    - !reference [.upstream_rules, rules]

"Linux i386":
  variables:
    TGT_ARCH: "i386"
    TGT_NAME: "${TGT_ARCH}"
  <<: *linux_script_steps

"Linux amd64":
  variables:
    TGT_ARCH: "amd64"
    TGT_NAME: "${TGT_ARCH}"
  <<: *linux_script_steps

"Linux armhf":
  variables:
    TGT_ARCH: "armhf"
    TGT_NAME: "${TGT_ARCH}"
  <<: *linux_script_steps

"Linux arm64":
  variables:
    TGT_ARCH: "arm64"
    TGT_NAME: "${TGT_ARCH}"
  <<: *linux_script_steps

#-----------------------------------------------------------#
# Debian Bookworm / Trixie .deb (same as OpenRGB pipeline)  #
#-----------------------------------------------------------#
.hidden_deb_script: &debian_script_steps
  <<: *ccache_init
  image: registry.gitlab.com/openrgbdevelopers/openrgb-linux-ci-deb-builder:$TGT_DEB-$TGT_ARCH
  tags:
    - linux
    - $TGT_ARCH
  stage: build
  script:
    - chmod +x scripts/build-package-files.sh
    - ./scripts/build-package-files.sh debian/changelog
    - dpkg-architecture -l
    - dpkg-buildpackage -us -B
    - rm -v ../openrgb-plugin-3d-spatial-dbgsym*.deb || true
    - mv -v ../openrgb-plugin-3d-spatial*.deb ./
  artifacts:
    name: "${CI_PROJECT_NAME}_Linux_${TGT_ARCH}_deb_${CI_COMMIT_SHORT_SHA}"
    paths:
      - openrgb-plugin-3d-spatial*.deb
    exclude:
      - openrgb-plugin-3d-spatial-dbgsym*.deb
    expire_in: 30 days
  rules:
    - !reference [.upstream_rules, rules]

"Linux i386 .deb (Debian Bookworm)":
  variables:
    TGT_ARCH: "i386"
    TGT_DEB: "bookworm"
  <<: *debian_script_steps

"Linux i386 .deb (Debian Trixie)":
  variables:
    TGT_ARCH: "i386"
    TGT_DEB: "trixie"
  <<: *debian_script_steps

"Linux amd64 .deb (Debian Bookworm)":
  variables:
    TGT_ARCH: "amd64"
    TGT_DEB: "bookworm"
  <<: *debian_script_steps

"Linux amd64 .deb (Debian Trixie)":
  variables:
    TGT_ARCH: "amd64"
    TGT_DEB: "trixie"
  <<: *debian_script_steps

"Linux armhf .deb (Debian Bookworm)":
  variables:
    TGT_ARCH: "armhf"
    TGT_DEB: "bookworm"
  <<: *debian_script_steps

"Linux armhf .deb (Debian Trixie)":
  variables:
    TGT_ARCH: "armhf"
    TGT_DEB: "trixie"
  <<: *debian_script_steps

"Linux arm64 .deb (Debian Bookworm)":
  variables:
    TGT_ARCH: "arm64"
    TGT_DEB: "bookworm"
  <<: *debian_script_steps

"Linux arm64 .deb (Debian Trixie)":
  variables:
    TGT_ARCH: "arm64"
    TGT_DEB: "trixie"
  <<: *debian_script_steps

#-----------------------------------------------------------#
# Fedora 44 RPM (OpenRGB pipeline)                          #
#-----------------------------------------------------------#
"Linux amd64 .rpm (Fedora 44)":
  image: fedora:44
  stage: build
  script:
    - dnf install rpmdevtools dnf-plugins-core gcc-c++ qt6-qtbase-devel qt6-linguist mesa-libGL-devel git wget -y
    - rpmdev-setuptree
    - chmod +x scripts/build-package-files.sh
    - ./scripts/build-package-files.sh fedora/OpenRGB3DSpatialPlugin.spec
    - cp fedora/OpenRGB3DSpatialPlugin.spec /root/rpmbuild/SPECS
    - cp -rp . /root/rpmbuild/SOURCES/OpenRGB3DSpatialPlugin
    - cd /root/rpmbuild
    - dnf builddep SPECS/OpenRGB3DSpatialPlugin.spec -y
    - rpmbuild -ba SPECS/OpenRGB3DSpatialPlugin.spec
    - cd RPMS/x86_64/
    - mv openrgb*.rpm ${CI_PROJECT_DIR}/
    - cd ${CI_PROJECT_DIR}
  artifacts:
    name: "${CI_PROJECT_NAME}_Linux_amd64_rpm_${CI_COMMIT_SHORT_SHA}"
    paths:
      - openrgb-plugin-3d-spatial*.rpm
    expire_in: 30 days
  rules:
    - !reference [.upstream_rules, rules]

#-----------------------------------------------------------#
# Flatpak extension against OpenRGB pipeline master         #
#-----------------------------------------------------------#
.hidden_flatpak_script: &flatpak_script_steps
  image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
  stage: build
  tags:
    - linux
    - ${TGT_ARCH}
  before_script:
    - curl --location --output artifacts.zip ${TGT_UPSTREAM_URL}
    - unzip artifacts.zip
    - flatpak install --user --assumeyes org.openrgb.OpenRGB.flatpak
  script:
    - flatpak-builder --user --disable-rofiles-fuse --repo=build/repo build/flatpak-build flatpak/org.openrgb.OpenRGB.Plugin.Spatial.yaml
    - flatpak build-bundle --runtime build/repo org.openrgb.OpenRGB.Plugin.Spatial.flatpak org.openrgb.OpenRGB.Plugin.Spatial 5
  artifacts:
    name: "${CI_PROJECT_NAME}_Linux_${TGT_ARCH}_Flatpak_${CI_COMMIT_SHORT_SHA}"
    paths:
      - org.openrgb.OpenRGB.Plugin.Spatial.flatpak
    expire_in: 30 days
  rules:
    - !reference [.upstream_rules, rules]

"Linux amd64 Flatpak":
  variables:
    TGT_UPSTREAM_URL: "https://gitlab.com/CalcProgrammer1/OpenRGB/-/jobs/artifacts/master/download?job=Linux+amd64+Flatpak"
    TGT_ARCH: "amd64"
  <<: *flatpak_script_steps

"Linux arm64 Flatpak":
  variables:
    TGT_UPSTREAM_URL: "https://gitlab.com/CalcProgrammer1/OpenRGB/-/jobs/artifacts/master/download?job=Linux+arm64+Flatpak"
    TGT_ARCH: "arm64"
  <<: *flatpak_script_steps

#-----------------------------------------------------------#
# Windows pipeline (OpenRGB-Qt-Packages 6.8.3)              #
#-----------------------------------------------------------#
"Windows 32":
  extends:
    - .shared_windows_runners
  stage: build
  script:
    - scripts\build-windows.bat 6.8.3 2022 32
    - mv "OpenRGB3DSpatialPlugin Windows 32-bit\OpenRGB3DSpatialPlugin.dll" .
  artifacts:
    name: "${CI_PROJECT_NAME}_Windows_32_${CI_COMMIT_SHORT_SHA}"
